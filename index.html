<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML File Concatenator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-hover: #222632;
    --border: #2e3348;
    --border-active: #6366f1;
    --primary: #6366f1;
    --primary-hover: #818cf8;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --success: #22c55e;
    --danger: #ef4444;
    --radius: 12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  h1 {
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(135deg, #6366f1 0%, #a78bfa 50%, #c084fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: .35rem;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: .95rem;
    margin-bottom: 2.5rem;
    text-align: center;
    max-width: 520px;
    line-height: 1.5;
  }

  .container {
    width: 100%;
    max-width: 680px;
  }

  .slot {
    background: var(--surface);
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 1.15rem 1.35rem;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    transition: border-color .2s, background .2s;
    cursor: pointer;
    position: relative;
  }

  .slot:hover { background: var(--surface-hover); border-color: #454b6a; }
  .slot.filled { border-style: solid; border-color: var(--success); }
  .slot.filled:hover { border-color: var(--success); }

  .slot-number {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: .95rem;
    flex-shrink: 0;
    transition: background .2s;
  }

  .slot.filled .slot-number { background: var(--success); color: #fff; }

  .slot-info { flex: 1; min-width: 0; }

  .slot-label {
    font-weight: 600;
    font-size: .92rem;
    margin-bottom: 2px;
  }

  .slot-filename {
    color: var(--text-muted);
    font-size: .82rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .slot-filename.has-file { color: var(--success); }

  .slot-actions {
    display: flex;
    gap: .5rem;
    flex-shrink: 0;
  }

  .btn-sm {
    padding: .4rem .75rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: .78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
  }

  .btn-sm:hover { border-color: var(--primary); color: var(--primary); }

  .btn-sm.remove { display: none; }
  .slot.filled .btn-sm.remove { display: inline-flex; }
  .btn-sm.remove:hover { border-color: var(--danger); color: var(--danger); }

  .slot input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .actions {
    margin-top: 1.5rem;
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    padding: .85rem 2rem;
    border-radius: var(--radius);
    border: none;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    display: inline-flex;
    align-items: center;
    gap: .5rem;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }

  .btn-outline {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text-muted);
  }
  .btn-outline:hover { border-color: var(--danger); color: var(--danger); }

  .preview-section {
    margin-top: 2.5rem;
    display: none;
  }

  .preview-section.visible { display: block; }

  .preview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: .75rem;
  }

  .preview-header h2 {
    font-size: 1.15rem;
    font-weight: 600;
  }

  .preview-meta {
    font-size: .8rem;
    color: var(--text-muted);
  }

  .preview-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    max-height: 360px;
    overflow: auto;
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    font-size: .8rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
    color: #cbd5e1;
  }

  .download-bar {
    margin-top: 1.5rem;
    display: none;
    justify-content: center;
  }

  .download-bar.visible { display: flex; }

  .btn-download {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #fff;
    padding: 1rem 2.5rem;
    font-size: 1.05rem;
    border-radius: var(--radius);
    border: none;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    display: inline-flex;
    align-items: center;
    gap: .6rem;
  }

  .btn-download:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(34,197,94,.3); }

  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .85rem 1.5rem;
    font-size: .88rem;
    color: var(--text);
    opacity: 0;
    transition: all .35s cubic-bezier(.4,0,.2,1);
    z-index: 999;
    pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .icon { font-size: 1.1em; }

  @media (max-width: 520px) {
    h1 { font-size: 1.5rem; }
    .slot { padding: .9rem 1rem; }
    .btn { padding: .7rem 1.4rem; font-size: .88rem; }
  }
</style>
</head>
<body>

<h1>HTML File Concatenator</h1>
<p class="subtitle">Upload five <code>.txt</code> files containing HTML code in order. They will be merged into a single, ready-to-deploy HTML file you can download instantly.</p>

<div class="container">
  <div id="slots"></div>

  <div class="actions">
    <button class="btn btn-primary" id="mergeBtn" disabled>
      <span class="icon">&#9889;</span> Concatenate Files
    </button>
    <button class="btn btn-outline" id="clearBtn">
      <span class="icon">&#10005;</span> Clear All
    </button>
  </div>

  <div class="download-bar" id="downloadBar">
    <button class="btn-download" id="downloadBtn">
      <span class="icon">&#11015;</span> Download Merged HTML File
    </button>
  </div>

  <div class="preview-section" id="previewSection">
    <div class="preview-header">
      <h2>Merged Output Preview</h2>
      <span class="preview-meta" id="previewMeta"></span>
    </div>
    <div class="preview-box" id="previewBox"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const SLOT_COUNT = 5;
  const files = new Array(SLOT_COUNT).fill(null);
  const contents = new Array(SLOT_COUNT).fill('');
  let mergedHTML = '';

  const slotsEl = document.getElementById('slots');
  const mergeBtn = document.getElementById('mergeBtn');
  const clearBtn = document.getElementById('clearBtn');
  const downloadBar = document.getElementById('downloadBar');
  const downloadBtn = document.getElementById('downloadBtn');
  const previewSection = document.getElementById('previewSection');
  const previewBox = document.getElementById('previewBox');
  const previewMeta = document.getElementById('previewMeta');
  const toastEl = document.getElementById('toast');

  function buildSlots() {
    slotsEl.innerHTML = '';
    for (let i = 0; i < SLOT_COUNT; i++) {
      const ordinal = ['1st', '2nd', '3rd', '4th', '5th'][i];
      const slot = document.createElement('div');
      slot.className = 'slot' + (files[i] ? ' filled' : '');
      slot.innerHTML = `
        <div class="slot-number">${i + 1}</div>
        <div class="slot-info">
          <div class="slot-label">${ordinal} File</div>
          <div class="slot-filename ${files[i] ? 'has-file' : ''}">${files[i] ? files[i].name : 'Click or drag a .txt file here'}</div>
        </div>
        <div class="slot-actions">
          <button class="btn-sm remove" data-idx="${i}">Remove</button>
        </div>
        <input type="file" accept=".txt,.html,.htm" data-idx="${i}" title="Choose file">
      `;
      slotsEl.appendChild(slot);
    }
    bindSlotEvents();
    updateMergeBtn();
  }

  function bindSlotEvents() {
    slotsEl.querySelectorAll('input[type="file"]').forEach(input => {
      input.addEventListener('change', function () {
        const idx = parseInt(this.dataset.idx, 10);
        if (this.files.length > 0) {
          handleFile(idx, this.files[0]);
        }
      });
    });

    slotsEl.querySelectorAll('.btn-sm.remove').forEach(btn => {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        const idx = parseInt(this.dataset.idx, 10);
        files[idx] = null;
        contents[idx] = '';
        hideMerged();
        buildSlots();
        toast('File removed from slot ' + (idx + 1));
      });
    });
  }

  function handleFile(idx, file) {
    const reader = new FileReader();
    reader.onload = function (e) {
      files[idx] = file;
      contents[idx] = e.target.result;
      hideMerged();
      buildSlots();
      toast('Loaded: ' + file.name);
    };
    reader.readAsText(file);
  }

  function updateMergeBtn() {
    const allFilled = files.every(f => f !== null);
    mergeBtn.disabled = !allFilled;
  }

  function hideMerged() {
    mergedHTML = '';
    downloadBar.classList.remove('visible');
    previewSection.classList.remove('visible');
  }

  mergeBtn.addEventListener('click', function () {
    mergedHTML = contents.join('\n');
    const sizeKB = (new Blob([mergedHTML]).size / 1024).toFixed(1);
    previewMeta.textContent = sizeKB + ' KB \u00B7 ' + mergedHTML.split('\n').length + ' lines';
    previewBox.textContent = mergedHTML;
    previewSection.classList.add('visible');
    downloadBar.classList.add('visible');
    previewSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    toast('Files concatenated successfully!');
  });

  downloadBtn.addEventListener('click', function () {
    if (!mergedHTML) return;
    const blob = new Blob([mergedHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'merged-website.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Download started!');
  });

  clearBtn.addEventListener('click', function () {
    files.fill(null);
    contents.fill('');
    hideMerged();
    buildSlots();
    toast('All slots cleared');
  });

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2500);
  }

  buildSlots();
})();
</script>
</body>
</html>
